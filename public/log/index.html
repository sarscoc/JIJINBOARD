  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,noarchive,max-image-preview:large">
  <meta name="description" content="ログにリアルタイムでコメントを付けるサイトです。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LOGCOMMENTS">
  <meta property="og:title" content="LOGCOMMENTS">
  <meta property="og:description" content="ログにリアルタイムでコメントを付けるサイトです。">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LOGCOMMENTS">
  <meta name="twitter:description" content="ログにリアルタイムでコメントを付けるサイトです。">
  <meta name="twitter:image:alt" content="LOGCOMMENTS">
  <title>LOGCOMMENTS</title>
  <link rel="stylesheet" href="style.css?v=20261103-layout1">
  <link rel="stylesheet" href="log-select-menu.css?v=20261103-select1">
  <link rel="stylesheet" href="embedded-layout.css?v=20261103-select1">
  <script>(function(){const p=new URL(location.href).searchParams;if(p.get("embedded")==="1")document.documentElement.classList.add("embedded");if(p.get("room"))document.documentElement.classList.add("existing-log")})()</script>
  <style>html.existing-log #homeView{display:none!important}html.existing-log #roomView.hidden{display:block!important}</style>

<script>
(()=>{if(parent===window)return;try{parent.JIJINBOARD_APPLY_FRAME_THEME?.(document,"log")}catch{}})();
</script>
<link rel="stylesheet" href="/shared/comment-layout.css?v=20261103-layout1">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">LOGCOMMENTS</a>
    <div id="presenceBar" class="presence-bar" aria-label="入室中のPL"></div>
    <div class="top-actions">
      <button id="profileBtn" class="quiet hidden">発言者</button>
    </div>
  </header>

  <main>
    <section id="homeView" class="home card">
      <label class="dropzone" id="dropzone">
        <input id="fileInput" type="file" accept=".html,text/html,.trpglog,.trpg.log,.log,application/json,text/plain">
        <span class="drop-title">HTML / TRPGログを選択</span>
        <span class="drop-note">または、ここへドロップ</span>
      </label>
      <label class="spoiler-setting"><input id="spoilerInput" type="checkbox"> この部屋をネタバレ有りにする</label>
      <div class="spoiler-details"><label>シナリオタイトル<input id="scenarioTitleInput" maxlength="120" placeholder="ログタイトルから自動入力"></label></div>
      <div id="spoilerDetails" class="spoiler-details hidden"><label>参加PC<input id="scenarioParticipantsInput" maxlength="300" placeholder="例：PC A / PC B / PC C"></label></div>
      <div id="importPreview" class="import-preview hidden">
        <div><strong id="importTitle"></strong><span id="importCount"></span></div>
        <button id="createRoomBtn" class="primary">アップロードする</button>
      </div>
      <p id="homeStatus" class="status"></p>
    </section>

    <section id="roomView" class="room hidden">
      <aside class="room-tools">
        <h1 id="roomTitle"></h1>
        <div class="filters">
          <select id="viewMode"><option value="compact">通常</option><option value="timeline">共有時間軸モード</option></select>
          <select id="tabFilter" aria-label="メインタブ"></select>
          <input id="searchInput" type="search" placeholder="ログ内検索">
          <label class="font-size-control" title="ログの文字サイズ"><span>A−</span><input id="fontSize" type="range" min="10" max="20" step="0.5" aria-label="ログの文字サイズ"><span>A＋</span></label>
          <button id="shareBtn" class="primary small hidden">共有URLをコピー</button>
          <button id="exportRoomBtn" class="quiet small">部屋を保存</button>
        </div>
        <p id="roomStatus" class="status"></p>
      </aside>

      <div class="reader-grid">
        <article id="logPane" class="log-pane" aria-label="TRPGログ"></article>
        <aside id="tabSuggestions" class="tab-suggestions hidden" aria-label="別タブの発言"></aside>
        <aside id="commentsPane" class="comments-pane">
          <div class="comments-head"><strong>COMMENTS</strong><span id="commentCount">0</span></div>
          <div id="commentsList" class="comments-list"><p class="empty">マーカーされた感想がここに並びます。</p></div>
        </aside>
      </div>
    </section>
  </main>

  <div id="selectionBar" class="selection-bar hidden">
    <span id="selectedQuote"></span><button id="markBtn" class="primary small">マーカー＋感想</button>
  </div>

  <dialog id="commentDialog">
    <form id="commentForm" method="dialog">
      <div class="comment-persona-picker"><span id="commentPersonaAvatar" class="comment-input-avatar"></span><select id="personaSelect" aria-label="発言者"></select></div>
      <textarea id="commentBody" rows="5" maxlength="4000" aria-label="感想"></textarea>
      <button id="commentDeleteBtn" class="comment-edit-delete hidden" type="button">このコメントを削除</button>
    </form>
  </dialog>

  <dialog id="imageDialog" class="image-dialog"><button type="button" class="image-dialog-close" data-close aria-label="閉じる">×</button><img id="expandedCommentImage" alt="コメント画像"></dialog>

  <dialog id="deleteRoomDialog">
    <form method="dialog"><div class="dialog-head"><strong id="deleteRoomTitle">部屋を削除しますか？</strong><button type="button" class="icon-btn" data-close>×</button></div><p class="delete-room-note">ログと感想は元に戻せません。</p><div class="delete-room-actions"><button id="saveDeleteRoomBtn" type="button" class="primary">保存して削除</button><button id="deleteOnlyRoomBtn" type="button" class="danger-quiet">削除だけ</button><button type="button" class="quiet" data-close>キャンセル</button></div></form>
  </dialog>

  <dialog id="profileDialog" class="log-speaker-dialog"><button type="button" data-close aria-label="閉じる">×</button><div id="logSpeakerSlot"></div></dialog>
  <script src="log-room-cache-preload.js?v=20261103-timeline1"></script>
  <script src="comment-window-loader.js?v=20261103-perf1"></script>
  <script src="../shared/log-format.js?v=20261102-dice1"></script>
  <script src="app.js?v=20261103-unified1"></script>
  <script src="log-fast-first-paint.js?v=20261102-dice1"></script>
  <script src="comment-submit-guard.js?v=20261102-room1"></script>
  <script src="comment-incremental-sync.js?v=20261103-unified1"></script>
  <script src="../board/speaker-editor.js?v=20261103-log-settings1"></script>
  <script src="log-speaker-settings.js?v=20261103-log-settings1"></script>
  <script src="../shared/player-master.js?v=20261103-unified1" data-jijin-player-master="1"></script>
  <script src="comment-avatar-fallback.js?v=20261102-room1"></script>
  <script src="flat-log-parser.js?v=20261102-tekey1"></script>
  <script src="trpg-log-import.js?v=20261102-room1"></script>
  <script src="shared-timeline-layout.js?v=20261103-timeline1"></script>
  <script src="virtual-log.js?v=20261103-timeline1"></script>
  <script src="virtual-scroll-stability.js?v=20261102-room1"></script>
  <script src="shared-tab-settings.js?v=20261103-select1"></script>
  <script src="upload-title-default.js?v=20261103-log-settings1"></script>
  <script src="log-select-menu.js?v=20261103-pretty1"></script>
  <script src="embedded-ready.js?v=20261102-room1"></script>
  <script src="log-app-bridge.js?v=20261102-room1"></script>
</body>
</html>
