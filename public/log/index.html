<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,noarchive,max-image-preview:large">
  <meta name="description" content="ログにリアルタイムでコメントを付けるサイトです。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TRPG LOG MARKER">
  <meta property="og:title" content="TRPG LOG MARKER">
  <meta property="og:description" content="ログにリアルタイムでコメントを付けるサイトです。">
  <meta property="og:image" content="https://logcomments.pages.dev/twitter-card.png?v=20260821">
  <meta property="og:image:secure_url" content="https://logcomments.pages.dev/twitter-card.png?v=20260821">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TRPG LOG MARKER">
  <meta name="twitter:description" content="ログにリアルタイムでコメントを付けるサイトです。">
  <meta name="twitter:image" content="https://logcomments.pages.dev/twitter-card.png?v=20260821">
  <meta name="twitter:image:alt" content="TRPG LOG MARKER">
  <title>TRPG LOG MARKER</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile-compact.css">
  <script>if(new URL(location.href).searchParams.get("embedded")==="1")document.documentElement.classList.add("embedded")</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">TRPG LOG MARKER</a>
    <div id="presenceBar" class="presence-bar" aria-label="入室中のPL"></div>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" title="表示切替">◐</button>
      <button id="profileBtn" class="quiet hidden">発言者</button>
    </div>
  </header>

  <main>
    <section id="homeView" class="home card">
      <label class="dropzone" id="dropzone">
        <input id="fileInput" type="file" accept=".html,text/html,.trpglog,.trpg.log,.log,application/json,text/plain">
        <span class="drop-title">HTML / TRPGログを選択</span>
        <span class="drop-note">または、ここへドロップ</span>
      </label>
      <label class="spoiler-setting"><input id="spoilerInput" type="checkbox"> この部屋をネタバレ有りにする</label>
      <div class="spoiler-details"><label>シナリオタイトル<input id="scenarioTitleInput" maxlength="120" placeholder="ログタイトルから自動入力"></label></div>
      <div id="spoilerDetails" class="spoiler-details hidden"><label>参加PC<input id="scenarioParticipantsInput" maxlength="300" placeholder="例：PC A / PC B / PC C"></label></div>
      <div id="importPreview" class="import-preview hidden">
        <div><strong id="importTitle"></strong><span id="importCount"></span></div>
        <button id="createRoomBtn" class="primary">アップロードする</button>
      </div>
      <p id="homeStatus" class="status"></p>
    </section>

    <section id="roomView" class="room hidden">
      <aside class="room-tools">
        <h1 id="roomTitle"></h1>
        <div class="filters">
          <select id="viewMode"><option value="compact">通常</option><option value="timeline">共有時間軸モード</option></select>
          <select id="tabFilter" aria-label="メインタブ" title="メインタブを選択"><option value="">メインタブを選択</option></select>
          <input id="searchInput" type="search" placeholder="ログ内検索">
          <label class="font-size-control" title="ログの文字サイズ"><span>A−</span><input id="fontSize" type="range" min="10" max="20" step="0.5" aria-label="ログの文字サイズ"><span>A＋</span></label>
          <button id="shareBtn" class="primary small hidden">共有URLをコピー</button>
          <button id="exportRoomBtn" class="quiet small">部屋を保存</button>
        </div>
        <p id="roomStatus" class="status"></p>
      </aside>

      <div class="reader-grid">
        <article id="logPane" class="log-pane" aria-label="TRPGログ"></article>
        <aside id="tabSuggestions" class="tab-suggestions hidden" aria-label="別タブの発言"></aside>
        <aside id="commentsPane" class="comments-pane">
          <div class="comments-head"><strong>COMMENTS</strong><span id="commentCount">0</span></div>
          <div id="commentsList" class="comments-list"><p class="empty">マーカーされた感想がここに並びます。</p></div>
        </aside>
      </div>
    </section>
  </main>

  <div id="selectionBar" class="selection-bar hidden">
    <span id="selectedQuote"></span><button id="markBtn" class="primary small">マーカー＋感想</button>
  </div>

  <dialog id="commentDialog">
    <form id="commentForm" method="dialog">
      <div class="comment-persona-picker"><span id="commentPersonaAvatar" class="comment-input-avatar"></span><select id="personaSelect" aria-label="発言者"></select></div>
      <textarea id="commentBody" rows="5" maxlength="4000" aria-label="感想"></textarea>
      <button id="commentDeleteBtn" class="comment-edit-delete hidden" type="button">このコメントを削除</button>
    </form>
  </dialog>

  <dialog id="imageDialog" class="image-dialog"><button type="button" class="image-dialog-close" data-close aria-label="閉じる">×</button><img id="expandedCommentImage" alt="コメント画像"></dialog>

  <dialog id="deleteRoomDialog">
    <form method="dialog"><div class="dialog-head"><strong id="deleteRoomTitle">部屋を削除しますか？</strong><button type="button" class="icon-btn" data-close>×</button></div><p class="delete-room-note">ログと感想は元に戻せません。</p><div class="delete-room-actions"><button id="saveDeleteRoomBtn" type="button" class="primary">保存して削除</button><button id="deleteOnlyRoomBtn" type="button" class="danger-quiet">削除だけ</button><button type="button" class="quiet" data-close>キャンセル</button></div></form>
  </dialog>

  <dialog id="profileDialog" class="compact-profile-dialog">
    <form id="profileForm" method="dialog">
      <div class="profile-close-row"><button type="button" class="icon-btn" data-close aria-label="閉じる">×</button></div>

      <div class="profile-person-row profile-pl-row">
        <input id="plName" maxlength="80" required placeholder="PL名" aria-label="PL名">
        <label class="profile-image-control" title="PL画像を選択">
          <span id="plIconPreview" class="profile-image-preview">画像</span>
          <span class="profile-image-text">画像</span>
          <input id="plIconInput" type="file" accept="image/*">
        </label>
        <div class="profile-marker-control" aria-label="PLのマーカー色">
          <span class="profile-marker-label">マーカー色</span>
          <label class="marker-choice light" title="白背景用の色"><span>白</span><b id="plMarkerLightPreview"></b><input id="plMarkerColor" type="color" value="#ffe66b" aria-label="白背景用マーカー色"></label>
          <label class="marker-choice dark" title="黒背景用の色"><span>黒</span><b id="plMarkerDarkPreview"></b><input id="plMarkerColorDark" type="color" value="#ffe66b" aria-label="黒背景用マーカー色"></label>
        </div>
      </div>

      <div id="personaList" class="profile-persona-list"></div>

      <div class="profile-person-row profile-add-row">
        <input id="newPersonaName" maxlength="80" placeholder="PC名" aria-label="PC名">
        <input id="newPersonaType" type="hidden" value="PC">
        <label class="profile-image-control" title="PC画像を選択">
          <span id="newPersonaImagePreview" class="profile-image-preview">画像</span>
          <span class="profile-image-text">画像</span>
          <input id="newPersonaIcon" type="file" accept="image/*">
        </label>
        <div class="profile-marker-control" aria-label="PCのマーカー色">
          <span class="profile-marker-label">マーカー色</span>
          <label class="marker-choice light" title="白背景用の色"><span>白</span><b id="newPersonaMarkerLightPreview"></b><input id="newPersonaColor" type="color" value="#ffe66b" aria-label="白背景用マーカー色"></label>
          <label class="marker-choice dark" title="黒背景用の色"><span>黒</span><b id="newPersonaMarkerDarkPreview"></b><input id="newPersonaColorDark" type="color" value="#ffe66b" aria-label="黒背景用マーカー色"></label>
        </div>
        <button type="button" id="savePersonaBtn" class="profile-add-button">＋</button>
      </div>

      <div class="profile-transfer">
        <button type="button" id="transferToggle" class="profile-transfer-toggle">引き継ぎ設定</button>
        <div id="transferPanel" class="profile-transfer-panel hidden">
          <button type="button" id="issueTransferBtn" class="quiet">別端末へ引き継ぐ</button>
          <input id="transferCodeInput" maxlength="20" placeholder="引き継ぎコード">
          <button type="button" id="redeemTransferBtn" class="quiet">引き継ぐ</button>
        </div>
      </div>

      <button type="submit" class="primary profile-save">保存</button>
    </form>
  </dialog>
  <script src="app.js"></script>
  <script src="profile-compact.js"></script>
  <script src="flat-log-parser.js"></script>
  <script src="trpg-log-import.js"></script>
  <script src="virtual-log.js"></script>
  <script src="virtual-scroll-stability.js"></script>
  <script src="shared-tab-settings.js"></script>
  <script src="upload-title-default.js"></script>
</body>
</html>
