  const cell=item?.cells?.[chId];

    const ch=state.characters.find(c=>c.id===cell.ownerId);
    if(ch?.base?.matrix){
      while(ch.base.matrix.length<=cell.row)ch.base.matrix.push([]);
      while(ch.base.matrix[cell.row].length<=cell.col)ch.base.matrix[cell.row].push('');
      ch.base.matrix[cell.row][cell.col]=value;

    if(src?.matrix){
      while(src.matrix.length<=cell.row)src.matrix.push([]);
      while(src.matrix[cell.row].length<=cell.col)src.matrix[cell.row].push('');
      src.matrix[cell.row][cell.col]=value;
      cell.value=value;

    const ch=state.characters.find(c=>c.id===chId);

function normalizedGroups(items){
  const groups=(state.layout.groups||[]).map(g=>({...g}));
  const groupIds=new Set(groups.map(g=>g.id));
  const buckets=new Map();
  buckets.set('ungrouped',[]);
  for(const g of groups)buckets.set(g.id,[]);
  for(const item of items){
    const gid=state.layout.assignments?.[item.key];
    if(gid && groupIds.has(gid))buckets.get(gid).push(item);
    else buckets.get('ungrouped').push(item);
  }

  for(const [gid,list] of buckets){
    const keys=list.map(item=>item.key);
    const order=ensureItemOrderForGroup(gid,keys);

function normalizeRatingMax(value,fallback=5){

function renderRatingPart(part,itemMap,ch,mode='table'){
  const cfg=getRatingConfig(part);
  const value=Math.max(0,Math.min(cfg.max,Math.round(getRatingValue(part,ch.id))));
  const glyph=ratingShapes[cfg.shape]||ratingShapes.heart;
  // Spreadsheet ratings follow the spreadsheet text color. Character/question pages
  // follow that Character's answer-text color instead of a fixed accent color.
  const answerColor=mode==='table' ? 'var(--db-text)' : getCharacterDesign(ch.id).answerText;
  const offColor=mode==='table' ? 'var(--db-text)' : hexToRgba(answerColor,.28);
  const compact=mode==='table' && cfg.max>12;
  const buttons=compact
    ? `<button type="button" class="rating-symbol rating-compact-symbol ${value>0?'on':''}" data-rating-cycle="1" aria-label="評価 ${value}/${cfg.max}">${value>0?glyph.on:glyph.off}</button>`
    : Array.from({length:cfg.max},(_,i)=>{
        const n=i+1,on=n<=value;
        return `<button type="button" class="rating-symbol ${on?'on':''}" data-rating-value="${n}" aria-label="${n}/${cfg.max}">${on?glyph.on:glyph.off}</button>`;
      }).join('');

}
function syncRatingWidgets(partId,chId){
  const part=resolveVisualPart(partId);
  if(!part)return;
  const cfg=getRatingConfig(part),glyph=ratingShapes[cfg.shape]||ratingShapes.heart;
  const value=Math.max(0,Math.min(cfg.max,Math.round(getRatingValue(part,chId))));
  document.querySelectorAll('[data-rating-part]').forEach(host=>{
    if(host.dataset.ratingPart!==partId || host.dataset.ratingChar!==chId)return;
    host.querySelectorAll('[data-rating-value]').forEach(btn=>{
      const on=(Number(btn.dataset.ratingValue)||0)<=value;
      btn.classList.toggle('on',on);btn.textContent=on?glyph.on:glyph.off;
    });
    const compact=host.querySelector('[data-rating-cycle]');
    if(compact){compact.classList.toggle('on',value>0);compact.textContent=value>0?glyph.on:glyph.off;}
    const num=host.querySelector('.rating-number');if(num)num.textContent=`${value}/${cfg.max}`;
  });
}
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-rating-value],[data-rating-cycle]');if(!btn)return;
  const host=btn.closest('[data-rating-part]');if(!host)return;
  e.preventDefault();e.stopPropagation();
  const part=resolveVisualPart(host.dataset.ratingPart);if(!part)return;
  const current=Math.round(getRatingValue(part,host.dataset.ratingChar));
  if(btn.hasAttribute('data-rating-cycle')){
    const cfg=getRatingConfig(part);
    setRatingValue(part.id,host.dataset.ratingChar,current>=cfg.max?0:current+1);
    return;
  }
  const clicked=Number(btn.dataset.ratingValue)||0;
  setRatingValue(part.id,host.dataset.ratingChar,current===clicked?0:clicked);
});

          <textarea class="character-answer" data-auto-video-input="character"
            data-item-key="${esc(item.key)}"
            data-char-id="${ch.id}">${esc(getValueForItem(item,ch.id))}</textarea>
          <div class="auto-video-preview">${renderAutoVideoEmbed(getValueForItem(item,ch.id))}</div>
        </div>
      </div>`;
    }

    for(const part of parts){
      out+=`<div class="character-row">
        <div class="character-row-label">
          <b>${esc(part.name||'表示パーツ')}</b>
          <span>${partTypeLabel(part.type)}</span>
        </div>
        <div class="character-part">${renderPartCell(part,itemMap,ch,'character')}</div>
      </div>`;
    }

    out+='</section>';
  }

  out+='</div>';
  root.innerHTML=out;

  function selectCharacterByIndex(index){
    if(!chars.length)return;
    const wrapped=(index+chars.length)%chars.length;
    state.selectedCharacterId=chars[wrapped].id;
    renderCharacterView();
  }

  root.querySelectorAll('[data-character-tab]').forEach(btn=>{
    btn.onclick=()=>{
      state.selectedCharacterId=btn.dataset.characterTab;
      renderCharacterView();
    };
  });

  const prev=root.querySelector('#carouselPrev');
  const next=root.querySelector('#carouselNext');
  if(prev)prev.onclick=()=>selectCharacterByIndex(activeIndex-1);
  if(next)next.onclick=()=>selectCharacterByIndex(activeIndex+1);

  const track=root.querySelector('#characterCarouselTrack');
  const activeBtn=track?.querySelector('.character-tab.on');
  if(activeBtn){
    requestAnimationFrame(()=>activeBtn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}));
  }

  let swipeStartX=null;
  const page=root.querySelector('.character-page');
  if(page){
    page.addEventListener('pointerdown',e=>{
      if(e.target.closest('input,textarea,select,button'))return;
      swipeStartX=e.clientX;
    });
    page.addEventListener('pointerup',e=>{
      if(swipeStartX===null)return;
      const dx=e.clientX-swipeStartX;
      swipeStartX=null;
      if(Math.abs(dx)<45)return;
      selectCharacterByIndex(activeIndex+(dx<0?1:-1));
    });
    page.addEventListener('pointercancel',()=>{swipeStartX=null});
  }

  root.querySelectorAll('.character-answer').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const item=itemMap.get(inp.dataset.itemKey);
      if(!item)return;
      setUnifiedValue(item,inp.dataset.charId,inp.value);
      renderCharacterView();
      showToast('保存しました');
    });
  });

  root.querySelectorAll('[data-routine-part]').forEach(btn=>{
    btn.onclick=()=>openRoutineEditor(btn.dataset.routinePart,btn.dataset.routineChar);
  });
  hydrateImageParts(root);
  bindImagePartControls(root,async()=>{
    renderCharacterView();
  });
  root.querySelectorAll('[data-radar-open]').forEach(btn=>{
    btn.onclick=()=>openRadarEditor(btn.dataset.radarOpen,btn.dataset.radarChar);
  });

  $('jumpNav').querySelectorAll('[data-jump]').forEach(btn=>{
    btn.onclick=()=>{
      const el=document.getElementById(`cgroup-${btn.dataset.jump}`);
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    };
  });
}



function getGroupLayout(groupId,groupName=''){
  const saved=state.layout.groupLayouts?.[groupId];
  if(saved)return saved;
  if(/基本情報|基本|profile|プロフィール/i.test(String(groupName||'')))return 'inline';
  return 'free';
}
function groupLayoutOptions(selected='free'){
  const opts=[
    ['free','自由'],
    ['inline','横並び'],
    ['list','リスト'],
    ['columns','3列']
  ];
  return opts.map(([v,label])=>`<option value="${v}" ${v===selected?'selected':''}>${label}</option>`).join('');
}
function applyGroupLayoutToRendered(groupId,layout){
  if(!groupId || !layout)return;
  document.querySelectorAll('.character-sheet-group').forEach(group=>{
    if(group.dataset.sheetGroupId===groupId || group.dataset.fullGroupId===groupId)group.dataset.layout=layout;
  });
}

function autoGrowCharacterField(el){

  el.style.height='auto';
  el.style.height=Math.max(22,el.scrollHeight)+'px';
}

    el.addEventListener('input',()=>autoGrowCharacterField(el));
  });
}

function orderedSheetGroups(groups){
  const all=[...groups,{id:'ungrouped',name:'未分類'}];
  const order=state.layout.sheetLayout?.order||[];
  const pos=new Map(order.map((id,i)=>[id,i]));
  return all.slice().sort((a,b)=>{
    const ai=pos.has(a.id)?pos.get(a.id):9999;
    const bi=pos.has(b.id)?pos.get(b.id):9999;
    if(ai!==bi)return ai-bi;
    return all.indexOf(a)-all.indexOf(b);
  });
}
function sheetGroupSpan(groupId){
  const saved=Number(state.layout.sheetLayout?.sizes?.[groupId]);
  if([2,3,4,6].includes(saved))return saved;
  // migrate v92 values: 4/6/8/12 => 2/3/4/6
  if(saved===8)return 4;
  if(saved===12)return 6;
  if(saved===4)return 2;
  if(saved===6)return 3;
  const old=state.layout.sheetLayout?.placement?.[groupId];
  return old==='full'?6:3;
}
function sheetGroupHeight(groupId){
  const h=Number(state.layout.sheetLayout?.heights?.[groupId]);
  return [1,2,3,4].includes(h)?h:1;
}
function sheetGroupPosition(groupId){
  const p=state.layout.sheetLayout?.positions?.[groupId];
  if(p && Number.isFinite(Number(p.row)) && Number.isFinite(Number(p.col))){
    return {row:Math.max(1,Number(p.row)),col:Math.max(1,Math.min(6,Number(p.col)))};
  }
  return null;
}
function setSheetGroupPosition(groupId,row,col){
  state.layout.sheetLayout.positions[groupId]={
    row:Math.max(1,Math.floor(row)),
    col:Math.max(1,Math.min(6,Math.floor(col)))
  };
  saveLayoutState();
}
function characterSheetColumnStart(charId,col,span){
  const safe=Math.min(Math.max(1,Number(col)||1),Math.max(1,7-span));
  return getCharacterDesign(charId).mirrorLayout ? (8-safe-span) : safe;
}
function ensureSheetGridPositions(){
  ensureSheetLayoutOrder();
  let cursorCol=1,cursorRow=1;
  for(const id of state.layout.sheetLayout.order){
    if(sheetGroupPosition(id))continue;
    const span=sheetGroupSpan(id);
    if(cursorCol+span-1>6){cursorRow++;cursorCol=1}
    state.layout.sheetLayout.positions[id]={row:cursorRow,col:cursorCol};
    cursorCol+=span;
    if(cursorCol>6){cursorRow++;cursorCol=1}
  }
}


function openCharacterPopup(charId){
  const selected=state.characters.find(c=>c.id===charId);
  if(!selected)return;

  const items=visibleItems(collectUnifiedItems());
  const itemMap=new Map(items.map(i=>[i.key,i]));
  const {groups,buckets}=normalizedGroups(items);
  const orderedGroups=orderedSheetGroups(groups);

  function renderCharacterGroupsFor(ch){
    const rendered=[];

    function renderCharacterGroup(g){
      const groupItems=buckets.get(g.id)||[];
      const parts=(state.layout.parts||[]).filter(p=>p.groupId===g.id && p.type!=='bar');
      if(!groupItems.length && !parts.length)return '';

      const groupLayout=getGroupLayout(g.id,g.name);
      let groupHtml=`<section class="character-sheet-group" data-sheet-group-id="${esc(g.id)}" data-layout="${groupLayout}">
        <div class="character-sheet-group-title">${esc(g.name)}</div>
        <div class="character-sheet-rows">`;

      for(const item of groupItems){
        const type=getItemType(item.key);
        if(type!=='text'){
          groupHtml+=`<div class="character-sheet-row visual typed-visual typed-${type}">
            <div class="character-sheet-label">${esc(item.label)}</div>
            <div class="character-sheet-part">${renderTypedItem(item,ch,'character')}</div>
          </div>`;
          continue;
        }

        const value=getValueForItem(item,ch.id);
        const longish=String(value||'').length>36 || String(value||'').includes('\n');
        groupHtml+=`<div class="character-sheet-row ${longish?'long':''}">
          <div class="character-sheet-label">${esc(item.label)}</div>
          <div class="character-sheet-value">
            <textarea class="character-sheet-edit" data-auto-video-input="character"
              data-character-popup-item="${esc(item.key)}"
              data-character-popup-char="${ch.id}">${esc(value)}</textarea>
            <div class="auto-video-preview">${renderAutoVideoEmbed(value)}</div>
          </div>
        </div>`;
      }

      for(const part of parts){
        groupHtml+=`<div class="character-sheet-row visual">
          <div class="character-sheet-label">${esc(part.name||'表示パーツ')}</div>
          <div class="character-sheet-part">${renderPartCell(part,itemMap,ch,'character')}</div>
        </div>`;
      }

      groupHtml+='</div></section>';
      return groupHtml;
    }

    ensureSheetGridPositions();

    for(const g of orderedGroups){
      const markup=renderCharacterGroup(g);
      if(!markup)continue;
      const span=sheetGroupSpan(g.id);
      const pos=sheetGroupPosition(g.id)||{row:1,col:1};
      const safeCol=characterSheetColumnStart(ch.id,pos.col,span);
      const rowSpan=sheetGroupHeight(g.id);

      rendered.push(markup.replace(
        '<section class="character-sheet-group"',
        `<section class="character-sheet-group" style="grid-column:${safeCol} / span ${span};grid-row:${pos.row} / span ${rowSpan}"`
      ));
    }

    return rendered;
  }

  function characterPageVars(ch){
    const d=getCharacterDesign(ch.id);
    return {
      d,
      style:[
        `--sheet-accent:${d.accent}`,
        `--sheet-accent-soft:${hexToRgba(d.accent,.16)}`,
        `--character-bg:${d.bg}`,
        `--character-text:${d.answerText}`,
        `--character-question-text:${d.questionText}`,
        `--character-answer-text:${d.answerText}`,
        `--character-bg-fit:${d.fit}`,
        `--character-bg-opacity:${d.opacity}`,
        `--character-bg-fade:${1-d.opacity}`
      ].join(';')
    };
  }

  /* v136: clicking a Character name always opens ONE Character in this popup.
     The horizontal all-Character view belongs only to the main Character-page mode. */
  const connected=false;

  if(!connected){
    const ch=selected;
    $('characterPopupTitle').textContent=characterListParts(ch.name).ho;

    const vars=characterPageVars(ch);
    const characterModal=$('characterPopup').querySelector('.modal');
    characterModal.dataset.characterDesignId=ch.id;
    characterModal.style.cssText += ';'+vars.style;
    applyCharacterBackgroundImage(ch.id);

    const rendered=renderCharacterGroupsFor(ch);
    $('characterPopupBody').innerHTML=(!rendered.length)
      ? '<div class="character-sheet-empty">表示できる項目がありません</div>'
      : `<div class="character-sheet-grid">${rendered.join('')}</div>`;
  }else{
    $('characterPopupTitle').textContent='Character';
    const characterModal=$('characterPopup').querySelector('.modal');
    characterModal.dataset.characterDesignId=selected.id;
    characterModal.style.removeProperty('--character-bg-image');

    $('characterPopupBody').innerHTML=`
      <div class="connected-character-strip">
        ${state.characters.map(ch=>{
          const vars=characterPageVars(ch);
          const rendered=renderCharacterGroupsFor(ch);
          return `<article class="connected-character-page"
            data-connected-character="${ch.id}"
            style="${vars.style}">
            <div class="connected-character-head">
              <div class="connected-character-title">${esc(characterListParts(ch.name).ho)}</div>
              <button type="button" class="connected-character-gear"
                data-connected-design="${ch.id}" title="このCharacterのデザイン">⚙</button>
            </div>
            <div class="connected-character-body">
              ${rendered.length
                ? `<div class="character-sheet-grid">${rendered.join('')}</div>`
                : '<div class="character-sheet-empty">表示できる項目がありません</div>'}
            </div>
          </article>`;
        }).join('')}
      </div>`;
  }

  openModalById('characterPopup');
  bindCharacterAutoGrow($('characterPopupBody'));

  $('characterPopupBody').querySelectorAll('.character-sheet-edit').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const item=itemMap.get(inp.dataset.characterPopupItem);
      if(!item)return;
      setUnifiedValue(item,inp.dataset.characterPopupChar,inp.value);
      renderDataTable();
      showToast('保存しました');
    });
  });

  $('characterPopupBody').querySelectorAll('[data-routine-part]').forEach(btn=>{
    btn.onclick=()=>openRoutineEditor(btn.dataset.routinePart,btn.dataset.routineChar);
  });

  $('characterPopupBody').querySelectorAll('[data-radar-open]').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      openRadarEditor(btn.dataset.radarOpen,btn.dataset.radarChar);
    };
  });

  hydrateImageParts($('characterPopupBody'));
  bindImagePartControls($('characterPopupBody'),async()=>{
    openCharacterPopup(selected.id);
  });

  $('characterPopupBody').querySelectorAll('[data-connected-design]').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const id=btn.dataset.connectedDesign;
      const modal=$('characterPopup').querySelector('.modal');
      modal.dataset.characterDesignId=id;
      openCharacterDesign();
    };
  });

  if(connected){
    requestAnimationFrame(async()=>{
      for(const page of $('characterPopupBody').querySelectorAll('[data-connected-character]')){
        const id=page.dataset.connectedCharacter;
        try{
          const blob=await loadImageBlob('character-background',id);
          if(blob){
            const url=URL.createObjectURL(blob);
            page.dataset.bgObjectUrl=url;
            page.style.setProperty('--character-bg-image',`url("${url}")`);
            page.style.setProperty('--character-has-bg-image','1');
          }else{
            page.style.removeProperty('--character-bg-image');
            page.style.removeProperty('--character-has-bg-image');
          }
        }catch(_){
          page.style.removeProperty('--character-bg-image');
          page.style.removeProperty('--character-has-bg-image');
        }
      }
    });
  }
}
function closeCharacterPopup(){
  $('characterPopupBody')?.querySelectorAll('[data-bg-object-url]').forEach(el=>{
    try{URL.revokeObjectURL(el.dataset.bgObjectUrl)}catch(_){}
  });
  closeModalById('characterPopup');
}
$('characterPopupCloseBtn').onclick=closeCharacterPopup;
$('characterPopup').addEventListener('click',e=>{

});


function sheetLayoutHasUngroupedContent(){
  const items=visibleItems(collectUnifiedItems());
  const {buckets}=normalizedGroups(items);
  const itemCount=(buckets.get('ungrouped')||[]).length;
  const partCount=(state.layout.parts||[]).filter(p=>p.groupId==='ungrouped' && p.type!=='bar').length;
  return itemCount>0 || partCount>0;
}
function ensureSheetLayoutOrder(){
  const ids=[...(state.layout.groups||[]).map(g=>g.id),'ungrouped'];
  const current=state.layout.sheetLayout.order||[];
  const seen=new Set();
  const order=[];
  for(const id of current){
    if(ids.includes(id)&&!seen.has(id)){order.push(id);seen.add(id)}
  }
  for(const id of ids){
    if(!seen.has(id)){order.push(id);seen.add(id)}
  }
  state.layout.sheetLayout.order=order;
}
function groupNameForLayout(id){
  if(id==='ungrouped')return '未分類';
  return state.layout.groups.find(g=>g.id===id)?.name||'グループ';
}
function getSheetBaseRows(){
  return Math.max(3,Math.min(20,Number(state.layout.sheetLayout?.baseRows)||6));
}
function setSheetBaseRows(n){
  state.layout.sheetLayout.baseRows=Math.max(3,Math.min(20,Math.floor(n)));
  saveLayoutState();
}
function renderSheetLayoutEditor(){
  ensureSheetGridPositions();
  const order=(state.layout.sheetLayout.order||[]).filter(id=>id!=='ungrouped' || sheetLayoutHasUngroupedContent());
  const canvas=$('sheetLayoutCanvas');
  const baseRows=getSheetBaseRows();
  $('sheetRowsCount').textContent=baseRows;
  const totalHeight=baseRows*64 + Math.max(0,baseRows-1)*6 + 12;
  canvas.style.minHeight=totalHeight+'px';
  canvas.style.height=totalHeight+'px';

  function card(id){
    const span=sheetGroupSpan(id);
    const pos=sheetGroupPosition(id)||{row:1,col:1};
    const safeCol=Math.max(1,Math.min(Number(pos.col)||1,Math.max(1,7-span)));
    const rowSpan=sheetGroupHeight(id);
    return `<div class="sheet-layout-card" draggable="true" data-layout-card="${id}"
      style="grid-column:${safeCol} / span ${span};grid-row:${pos.row} / span ${rowSpan}">
      <div class="sheet-layout-drag">⋮⋮</div>
      <div class="sheet-layout-name">${esc(groupNameForLayout(id))}</div>
      <select class="sheet-layout-style" data-layout-style="${id}" title="グループ内の表示方法">
        ${groupLayoutOptions(getGroupLayout(id,groupNameForLayout(id)))}
      </select>
      <div class="sheet-layout-controls">
        <div class="sheet-layout-size" aria-label="幅">
          <span class="sheet-layout-control-label">幅</span>
          <button type="button" data-size-id="${id}" data-size="2" class="${span===2?'active':''}">1/3</button>
          <button type="button" data-size-id="${id}" data-size="3" class="${span===3?'active':''}">1/2</button>
          <button type="button" data-size-id="${id}" data-size="4" class="${span===4?'active':''}">2/3</button>
          <button type="button" data-size-id="${id}" data-size="6" class="${span===6?'active':''}">全幅</button>
        </div>
        <div class="sheet-layout-height" aria-label="高さ">
          <span class="sheet-layout-control-label">高さ</span>
          <button type="button" data-height-id="${id}" data-height="1" class="${rowSpan===1?'active':''}">1</button>
          <button type="button" data-height-id="${id}" data-height="2" class="${rowSpan===2?'active':''}">2</button>
          <button type="button" data-height-id="${id}" data-height="3" class="${rowSpan===3?'active':''}">3</button>
          <button type="button" data-height-id="${id}" data-height="4" class="${rowSpan===4?'active':''}">4</button>
        </div>
      </div>
    </div>`;
  }

  canvas.innerHTML=`<div class="sheet-layout-drop-hint" id="sheetLayoutDropHint"></div>${order.map(card).join('')}`;

  canvas.querySelectorAll('[data-layout-style]').forEach(sel=>{
    sel.onchange=()=>{
      const groupId=sel.dataset.layoutStyle;
      state.layout.groupLayouts[groupId]=sel.value;
      saveLayoutState();
      applyGroupLayoutToRendered(groupId,sel.value);
    };
    sel.onpointerdown=e=>e.stopPropagation();
  });

  canvas.querySelectorAll('[data-size-id]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.sizeId;
      const span=Number(btn.dataset.size);
      state.layout.sheetLayout.sizes[id]=span;
      const p=sheetGroupPosition(id)||{row:1,col:1};
      if(p.col+span-1>6)p.col=Math.max(1,7-span);
      state.layout.sheetLayout.positions[id]=p;
      saveLayoutState();
      const cardEl=canvas.querySelector(`[data-layout-card="${CSS.escape(id)}"]`);
      if(cardEl){
        cardEl.style.gridColumn=`${p.col} / span ${span}`;
        cardEl.querySelectorAll('[data-size-id]').forEach(b=>b.classList.toggle('active',Number(b.dataset.size)===span));
      }
      metricsCache=null;
    };
    btn.onpointerdown=e=>e.stopPropagation();
  });

  canvas.querySelectorAll('[data-height-id]').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.heightId;
      const rowSpan=Number(btn.dataset.height);
      state.layout.sheetLayout.heights[id]=rowSpan;
      saveLayoutState();
      const cardEl=canvas.querySelector(`[data-layout-card="${CSS.escape(id)}"]`);
      if(cardEl){
        const p=sheetGroupPosition(id)||{row:1,col:1};
        cardEl.style.gridRow=`${p.row} / span ${rowSpan}`;
        cardEl.querySelectorAll('[data-height-id]').forEach(b=>b.classList.toggle('active',Number(b.dataset.height)===rowSpan));
      }
    };
    btn.onpointerdown=e=>e.stopPropagation();
  });

  let draggedId=null;
  let metricsCache=null;
  let hintRaf=0;
  let lastHintEvent=null;

  function measureCanvas(){
    const rect=canvas.getBoundingClientRect();
    const style=getComputedStyle(canvas);
    const gap=parseFloat(style.columnGap)||8;
    const padL=parseFloat(style.paddingLeft)||8;
    const padR=parseFloat(style.paddingRight)||8;
    const padT=parseFloat(style.paddingTop)||8;
    const usable=rect.width-padL-padR-gap*5;
    return {rect,gap,padL,padT,colW:usable/6};
  }

  function cellFromEvent(e){
    const m=metricsCache||(metricsCache=measureCanvas());
    const x=e.clientX-m.rect.left-m.padL;
    const y=e.clientY-m.rect.top-m.padT;
    const col=Math.max(1,Math.min(6,Math.floor(x/(m.colW+m.gap))+1));
    const row=Math.max(1,Math.min(baseRows,Math.floor(y/70)+1));
    return {row,col,...m};
  }

  function paintHint(e,id){
    const hint=$('sheetLayoutDropHint');
    if(!hint)return;
    const c=cellFromEvent(e);
    const span=sheetGroupSpan(id);
    const rowSpan=sheetGroupHeight(id);
    const col=Math.min(c.col,Math.max(1,7-span));
    const row=Math.min(c.row,Math.max(1,baseRows-rowSpan+1));
    hint.style.left=(c.padL+(col-1)*(c.colW+c.gap))+'px';
    hint.style.top=(c.padT+(row-1)*70)+'px';
    hint.style.width=(c.colW*span+c.gap*(span-1))+'px';
    hint.style.height=(64*rowSpan + 6*(rowSpan-1))+'px';
  }

  function scheduleHint(e,id){
    lastHintEvent={clientX:e.clientX,clientY:e.clientY};
    if(hintRaf)return;
    hintRaf=requestAnimationFrame(()=>{
      hintRaf=0;
      if(lastHintEvent)paintHint(lastHintEvent,id);
    });
  }

  canvas.querySelectorAll('[data-layout-card]').forEach(cardEl=>{
    cardEl.addEventListener('dragstart',e=>{
      draggedId=cardEl.dataset.layoutCard;
      metricsCache=measureCanvas(); // ドラッグ開始時に1回だけ計測
      cardEl.classList.add('dragging');
      canvas.classList.add('is-dragging');
      e.dataTransfer.effectAllowed='move';
      try{e.dataTransfer.setData('text/plain',draggedId)}catch(_){}
    });

    cardEl.addEventListener('dragend',()=>{
      cardEl.classList.remove('dragging');
      canvas.classList.remove('is-dragging');
      draggedId=null;
      metricsCache=null;
      lastHintEvent=null;
      if(hintRaf){cancelAnimationFrame(hintRaf);hintRaf=0}
    });
  });

  canvas.addEventListener('dragover',e=>{
    e.preventDefault();
    const id=draggedId || e.dataTransfer.getData('text/plain');
    if(id)scheduleHint(e,id);
  });

  canvas.addEventListener('drop',e=>{
    e.preventDefault();
    const id=draggedId || e.dataTransfer.getData('text/plain');
    if(!id)return;
    const c=cellFromEvent(e);
    const span=sheetGroupSpan(id);
    const rowSpan=sheetGroupHeight(id);
    const col=Math.min(c.col,Math.max(1,7-span));
    const row=Math.min(c.row,Math.max(1,baseRows-rowSpan+1));
    state.layout.sheetLayout.positions[id]={row,col};
    saveLayoutState();
    const cardEl=canvas.querySelector(`[data-layout-card="${CSS.escape(id)}"]`);
    if(cardEl){
      cardEl.style.gridColumn=`${col} / span ${span}`;
      cardEl.style.gridRow=`${row} / span ${rowSpan}`;
    }
    canvas.classList.remove('is-dragging');
    const hint=$('sheetLayoutDropHint');
    if(hint){hint.style.width='0';hint.style.height='0'}
    metricsCache=null;
  });
}

function renderCharacterSheetGroups(ch){
  const items=visibleItems(collectUnifiedItems());
  const itemMap=new Map(items.map(i=>[i.key,i]));
  const {groups,buckets}=normalizedGroups(items);
  const orderedGroups=orderedSheetGroups(groups);
  const rendered=[];
  const occupied=[];

  ensureSheetGridPositions();

  for(const g of orderedGroups){
    const groupItems=buckets.get(g.id)||[];
    const parts=(state.layout.parts||[]).filter(p=>p.groupId===g.id && p.type!=='bar');
    if(!groupItems.length && !parts.length)continue;

    const groupLayout=getGroupLayout(g.id,g.name);
    let groupHtml=`<section class="character-sheet-group" data-sheet-group-id="${esc(g.id)}" data-layout="${groupLayout}" data-full-group-id="${esc(g.id)}">
      <div class="character-sheet-group-title">${esc(g.name)}</div>
      <div class="character-sheet-rows">`;

    for(const item of groupItems){
      const type=getItemType(item.key);
      if(type!=='text'){
        groupHtml+=`<div class="character-sheet-row visual typed-visual typed-${type}">
          <div class="character-sheet-label">${esc(item.label)}</div>
          <div class="character-sheet-part">${renderTypedItem(item,ch,'character')}</div>
        </div>`;
        continue;
      }

      const value=getValueForItem(item,ch.id);
      const longish=String(value||'').length>36 || String(value||'').includes('\n');
      groupHtml+=`<div class="character-sheet-row ${longish?'long':''}">
        <div class="character-sheet-label">${esc(item.label)}</div>
        <div class="character-sheet-value">
          <textarea class="character-sheet-edit" data-auto-video-input="character"
            data-full-character-item="${esc(item.key)}"
            data-full-character-char="${ch.id}">${esc(value)}</textarea>
          <div class="auto-video-preview">${renderAutoVideoEmbed(value)}</div>
        </div>
      </div>`;
    }

    for(const part of parts){
      groupHtml+=`<div class="character-sheet-row visual">
        <div class="character-sheet-label">${esc(part.name||'表示パーツ')}</div>
        <div class="character-sheet-part">${renderPartCell(part,itemMap,ch,'character')}</div>
      </div>`;
    }

    groupHtml+='</div></section>';

    const span=sheetGroupSpan(g.id);
    const pos=sheetGroupPosition(g.id)||{row:1,col:1};
    const safeCol=characterSheetColumnStart(ch.id,pos.col,span);
    const rowSpan=sheetGroupHeight(g.id);
    occupied.push({start:safeCol,end:safeCol+span-1,row:pos.row});

    rendered.push({
      html:groupHtml,
      start:safeCol,
      span,
      row:pos.row,
      rowSpan
    });
  }

  const minCol=occupied.length?Math.min(...occupied.map(x=>x.start)):1;
  const maxCol=occupied.length?Math.max(...occupied.map(x=>x.end)):1;
  const usedCols=Math.max(1,maxCol-minCol+1);
  const compactRendered=rendered.map(entry=>entry.html.replace(
    '<section class="character-sheet-group"',
    `<section class="character-sheet-group" style="grid-column:${entry.start-minCol+1} / span ${entry.span};grid-row:${entry.row} / span ${entry.rowSpan}"`
  ));

  return {rendered:compactRendered,itemMap,usedCols,minCol,maxCol};
}

async function hydrateFullCharacterBackgrounds(){
  const root=$('fullCharacterPages');
  for(const page of root.querySelectorAll('[data-full-character-page]')){
    if(page.dataset.bgObjectUrl){
      try{URL.revokeObjectURL(page.dataset.bgObjectUrl)}catch(_){}
      delete page.dataset.bgObjectUrl;
    }
    const id=page.dataset.fullCharacterPage;
    try{
      const blob=await loadImageBlob('character-background',id);
      if(blob){
        const url=URL.createObjectURL(blob);
        page.dataset.bgObjectUrl=url;
        page.style.setProperty('--character-bg-image',`url("${url}")`);
        page.style.setProperty('--character-has-bg-image','1');
      }else{
        page.style.removeProperty('--character-bg-image');
        page.style.removeProperty('--character-has-bg-image');
      }
    }catch(_){
      page.style.removeProperty('--character-bg-image');
      page.style.removeProperty('--character-has-bg-image');
    }
  }
}

function syncFullCharacterGroupTitleHeights(){
  const root=$('fullCharacterPages');
  if(!root)return;
  const titles=[...root.querySelectorAll('.character-sheet-group[data-full-group-id] > .character-sheet-group-title')];
  if(!titles.length)return;

  // Reset first so shrinking the viewport can reduce a previously synchronized height.
  for(const title of titles)title.style.height='';

  const byGroup=new Map();
  for(const title of titles){
    const group=title.parentElement;
    const id=group?.dataset.fullGroupId;
    if(!id)continue;
    if(!byGroup.has(id))byGroup.set(id,[]);
    byGroup.get(id).push(title);
  }

  // Read all heights first, then write them together to avoid layout thrashing.
  const heights=[];
  for(const groupTitles of byGroup.values()){
    let max=0;
    for(const title of groupTitles)max=Math.max(max,title.getBoundingClientRect().height);
    heights.push([groupTitles,Math.ceil(max)]);
  }
  for(const [groupTitles,height] of heights){
    for(const title of groupTitles)title.style.height=`${height}px`;
  }
}

function renderDatabaseToc(orderedGroups,buckets){

    .filter(g=>(buckets.get(g.id)||[]).length || (state.layout.parts||[]).some(p=>p.groupId===g.id && p.type!=='bar'))

      if(target)target.scrollIntoView({behavior:'smooth',block:'start'});

  const organizeModalBody=$('organizeModal').querySelector('.modal');
  const updateOrganizeTocActive=()=>{
    const boxes=[...$('organizeGrid').querySelectorAll('[data-group-id]')];
    if(!boxes.length)return;
    const base=organizeModalBody.getBoundingClientRect().top+70;
    let active=boxes[0],best=Infinity;
    for(const box of boxes){
      const d=Math.abs(box.getBoundingClientRect().top-base);
      if(d<best){best=d;active=box}
    }
    $('organizeToc').querySelectorAll('[data-organize-jump]').forEach(btn=>{
      btn.classList.toggle('active',btn.dataset.organizeJump===active.dataset.groupId);
    });
  };
  organizeModalBody.onscroll=updateOrganizeTocActive;
  requestAnimationFrame(updateOrganizeTocActive);

  $('organizeFastDown').onclick=()=>{
    organizeModalBody.scrollTo({top:organizeModalBody.scrollHeight,behavior:'smooth'});
  };


  let dragKey='';
  let organizeScrollRaf=0;
  let organizeScrollSpeed=0;
  const organizeScrollHost=$('organizeModal').querySelector('.modal');

  const runOrganizeScroll=()=>{
    if(!organizeScrollSpeed){
      organizeScrollRaf=0;
      return;
    }
    organizeScrollHost.scrollTop+=organizeScrollSpeed;
    organizeScrollRaf=requestAnimationFrame(runOrganizeScroll);
  };
  const stopOrganizeScroll=()=>{
    organizeScrollSpeed=0;
    if(organizeScrollRaf){
      cancelAnimationFrame(organizeScrollRaf);
      organizeScrollRaf=0;
    }
  };
  organizeScrollHost.addEventListener('dragover',e=>{
    if(!dragKey)return;
    const r=organizeScrollHost.getBoundingClientRect();
    const edge=95;
    if(e.clientY>r.bottom-edge){
      const p=Math.min(1,(e.clientY-(r.bottom-edge))/edge);
      organizeScrollSpeed=8+p*24;
    }else if(e.clientY<r.top+edge){
      const p=Math.min(1,((r.top+edge)-e.clientY)/edge);
      organizeScrollSpeed=-(8+p*24);
    }else{
      organizeScrollSpeed=0;
    }
    if(organizeScrollSpeed && !organizeScrollRaf){
      organizeScrollRaf=requestAnimationFrame(runOrganizeScroll);

  // Drop onto another normal item = reorder inside that group.

      e.stopPropagation();
      $('organizeGrid').querySelectorAll('[data-sort-item]').forEach(c=>c.classList.remove('sort-before'));
      target.classList.add('sort-before');
    });
    target.addEventListener('dragleave',()=>target.classList.remove('sort-before'));
    target.addEventListener('drop',e=>{
      if(!dragKey || String(dragKey).startsWith('part:') || dragKey===target.dataset.sortItem)return;
      e.preventDefault();
      e.stopPropagation();

      const movingKey=dragKey;
      const targetKey=target.dataset.sortItem;
      const groupBox=target.closest('.group-box');
      const gid=groupBox?.dataset.groupId||'ungrouped';

      if(gid==='ungrouped')delete state.layout.assignments[movingKey];

        else state.layout.assignments[dragKey]=gid;
        moveItemToGroupOrder(dragKey,gid);

  $('organizeGrid').querySelectorAll('[data-part-group]').forEach(sel=>{

  $('organizeGrid').querySelectorAll('[data-v139-part-config]').forEach(btn=>{btn.onclick=()=>openV139PartConfig(btn.dataset.v139PartConfig);});

  function ensureItemVisualDefaults(item,type){
    const partId=itemVisualId(item.key);
    if(type==='rating' && !state.layout.ratingItems[partId])state.layout.ratingItems[partId]={max:5,shape:'heart'};
    if(type==='bipolar' && !state.layout.bipolarItems[partId])state.layout.bipolarItems[partId]={left:'理性',right:'感情'};
    if(type==='distribution' && !state.layout.distributionItems[partId])state.layout.distributionItems[partId]={style:'bar',labels:['仕事','趣味','睡眠']};

  $('organizeGrid').querySelectorAll('.item-group-select').forEach(sel=>{

function getComparisonConfig(part){const c=state.layout.comparisonItems?.[part.id]||{};return {sourceKey:c.sourceKey||part.fields?.[0]||'',max:Number(c.max)>0?Number(c.max):null};}
function renderComparisonPart(part,itemMap,ch,mode='table'){const c=getComparisonConfig(part),item=collectUnifiedItems().find(i=>i.key===c.sourceKey);if(!item)return '<div class="mini">比較項目なし</div>';const vals=state.characters.map(x=>Number(String(getValueForItem(item,x.id)??'').replace(/,/g,'').trim())).filter(Number.isFinite);const v=Number(String(getValueForItem(item,ch.id)??'').replace(/,/g,'').trim());if(!Number.isFinite(v))return `<div class="comparison-wrap comparison-mode-${mode}"><div class="mini">${esc(item.label)}：—</div></div>`;const max=c.max||Math.max(1,...vals.map(Math.abs));const pct=Math.max(0,Math.min(100,(v/max)*100));return `<div class="comparison-wrap comparison-mode-${mode}"><div class="comparison-bar-track"><div class="comparison-bar-fill" style="width:${pct}%"></div></div><div class="comparison-meta"><span>${esc(item.label)}</span><b>${esc(v)} / ${esc(max)}</b></div></div>`;}

function openV139PartConfig(partId){const part=resolveVisualPart(partId);if(!part)return;if(part.type==='bipolar'){const c=getBipolarConfig(part),left=prompt('左側の名前',c.left);if(left===null)return;const right=prompt('右側の名前',c.right);if(right===null)return;state.layout.bipolarItems[part.id]={left:left.trim()||'左',right:right.trim()||'右'};}else if(part.type==='distribution'){const c=getDistributionConfig(part),style=prompt('表示方法：bar または donut',c.style);if(style===null)return;const labels=prompt('内訳名をカンマ区切りで入力',c.labels.join(','));if(labels===null)return;state.layout.distributionItems[part.id]={style:String(style).trim()==='donut'?'donut':'bar',labels:labels.split(',').map(x=>x.trim()).filter(Boolean).slice(0,8)};}else if(part.type==='relation'){const c=getRelationConfig(part),metric=prompt('関係の項目名',c.metric);if(metric===null)return;const kind=prompt('方式：score または check',c.kind);if(kind===null)return;let max=c.max;if(String(kind).trim()!=='check'){const mv=prompt('最大値（3 / 5 / 10）',String(c.max));if(mv===null)return;max=[3,10].includes(Number(mv))?Number(mv):5;}state.layout.relationItems[part.id]={metric:metric.trim()||'関係',kind:String(kind).trim()==='check'?'check':'score',max};}else if(part.type==='comparison'){const items=collectUnifiedItems(),c=getComparisonConfig(part);const list=items.map((i,n)=>`${n+1}: ${i.label}`).join('\n');const current=Math.max(1,items.findIndex(i=>i.key===c.sourceKey)+1);const pick=prompt(`比較する項目番号を入力\n${list}`,String(current));if(pick===null)return;const item=items[Math.max(0,Math.min(items.length-1,(Number(pick)||1)-1))];if(!item)return;const max=prompt('最大値（空欄＝自動）',c.max||'');if(max===null)return;state.layout.comparisonItems[part.id]={sourceKey:item.key,max:Number(max)>0?Number(max):null};}saveState();renderOrganizeModal();v139RefreshViews();showToast('設定を保存しました');}

document.addEventListener('click',e=>{const d=e.target.closest('[data-distribution-edit]');if(d){e.preventDefault();e.stopPropagation();openDistributionEditor(d.dataset.distributionEdit,d.dataset.charId);return;}const t=e.target.closest('[data-timeline-edit]');if(t){e.preventDefault();e.stopPropagation();openTimelineEditor(t.dataset.timelineEdit,t.dataset.charId);return;}const r=e.target.closest('[data-relation-edit]');if(r){e.preventDefault();e.stopPropagation();openRelationEditor(r.dataset.relationEdit);return;}});

function migrateCharacters(){
  let changed=false;
  for(const ch of state.characters){
    const source=ch.alias||ch.name||'';
    const key=characterKey(source)||characterKey(ch.name);
    if(key && ch.key!==key){ch.key=key;changed=true;}

    // Older versions may have stored a whole concatenated cell.
    // Prefer the HO title segment as the compact display title.
    const raw=String(ch.name||'').replace(/\r/g,'').trim();
    const first=raw.split('\n')[0].trim();
    const hoMatch=first.match(/^(HO\s*0*\d+\s*[-－:]?\s*[^\s]*)/i);
    if(hoMatch && raw!==hoMatch[1]){
      ch.name=hoMatch[1].trim();
      changed=true;
    }
  }
  if(changed)saveState();
}

migrateCharacters();
renderCharacters();
renderSources();
renderDataTable();
bindDatabaseHorizontalWheel();
setMainView();
setSourceMode('google');
restorePendingRead();

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const open=[...document.querySelectorAll('.modal-backdrop.show')];
  if(!open.length)return;
  open[open.length-1].classList.remove('show');
  syncBodyModalLock();
});
