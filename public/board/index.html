<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,noarchive">
  <title>JIJINBOARD</title>
  <link rel="stylesheet" href="board.css?v=20260902-1">
  <link rel="stylesheet" href="board-extra.css">
  <link rel="stylesheet" href="participant.css?v=20260830-5">
  <link rel="stylesheet" href="theme-settings-compact.css?v=20260830-2">
  <style>
    .topbar{background:#fff!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;gap:6px!important}
    .log-sidebar{background:#fff!important}
    .topbar .presence-person b,.topbar .app-tabs button,
    .board-brand-kicker,.log-list-head>span{color:var(--jijin-pre-color1,#171a20)!important}
    .board-brand-stack{display:grid;grid-template-rows:auto auto;align-content:center;gap:1px;flex:0 1 auto;min-width:0;max-width:190px;line-height:1.15}
    .board-brand-kicker{font-size:8px;font-weight:900;letter-spacing:.16em;text-decoration:none;white-space:nowrap}
    .board-brand-title{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700;color:rgb(75,75,75)}
    .topbar>.presence-bar{flex:1 1 auto;min-width:0;margin-left:34px}

    /* Owner log settings: keep the same controls, but make the editor a compact card. */
    #logEditDialog{width:min(430px,calc(100vw - 20px))!important;max-width:430px!important;max-height:min(560px,calc(100vh - 20px))!important;border-radius:13px!important;overflow:auto!important}
    #logEditDialog .log-edit-card{min-width:0!important;padding:11px 13px 10px!important;gap:7px!important;background:rgba(255,255,255,.96)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
    #logEditDialog .log-edit-card>div:first-child{height:20px!important}
    #logEditDialog .log-edit-close{width:27px!important;height:27px!important;border-radius:7px!important;font-size:16px!important}
    #logEditDialog .log-edit-card label{gap:3px!important;font-size:9px!important}
    #logEditDialog .log-spoiler-edit{gap:5px!important;min-height:20px!important}
    #logEditDialog .log-spoiler-edit input{width:14px!important;height:14px!important}
    #logEditDialog .log-edit-card input[type=text],#logEditDialog .log-edit-card input:not([type]){height:31px!important;padding:5px 8px!important;border-radius:7px!important;font-size:10px!important}
    #logEditDialog .shared-tab-settings{gap:4px!important;padding-top:6px!important}
    #logEditDialog .shared-tab-head{gap:7px!important}
    #logEditDialog .shared-tab-head strong{font-size:9px!important}
    #logEditDialog .shared-tab-head small{font-size:7px!important}
    #logEditDialog .shared-tab-list{max-height:158px!important;gap:3px!important;padding-right:1px!important}
    #logEditDialog .shared-tab-row{grid-template-columns:15px minmax(0,1fr) auto auto!important;min-height:27px!important;padding:2px 5px!important;gap:5px!important;border-radius:7px!important}
    #logEditDialog .shared-tab-grip{font-size:11px!important}
    #logEditDialog .shared-tab-row strong{font-size:9px!important}
    #logEditDialog .shared-tab-order button{width:22px!important;height:21px!important;border-radius:5px!important;font-size:9px!important}
    #logEditDialog .shared-tab-visible{gap:3px!important;font-size:8px!important}
    #logEditDialog .shared-tab-visible input{width:13px!important;height:13px!important}
    #logEditDialog .log-display-mode-field{gap:3px!important}
    #logEditDialog .log-display-mode-field legend{font-size:8px!important}
    #logEditDialog .log-display-mode-options{gap:5px!important}
    #logEditDialog .log-display-mode-options label{min-height:27px!important;padding:0 7px!important;border-radius:7px!important;font-size:9px!important}
    #logEditDialog .log-edit-card>div:last-child{margin-top:0!important;gap:6px!important}
    #logEditDialog .log-edit-card>div:last-child .primary{padding:5px 10px!important;font-size:9px!important}
    #logEditDialog .log-delete-text{font-size:8px!important}

    @media(max-width:820px){
      .topbar{gap:4px!important}
      .board-brand-stack{min-width:0;max-width:126px}
      .board-brand-kicker{font-size:7px}
      .board-brand-title{font-size:10px}
      .topbar>.presence-bar{margin-left:24px}
    }
    @media(max-width:520px){
      #logEditDialog{width:calc(100vw - 14px)!important;max-width:calc(100vw - 14px)!important;max-height:calc(100vh - 14px)!important}
      #logEditDialog .log-edit-card{padding:9px 10px!important}
      #logEditDialog .shared-tab-list{max-height:145px!important}
    }
  </style>
  <script>
    (()=>{
      const id=new URL(location.href).searchParams.get('id');if(!id)return;
      try{
        const value=JSON.parse(localStorage.getItem(`jijinboardScopedTheme:${id}`)||'null');
        if(/^#[0-9a-f]{6}$/i.test(value?.color1||''))document.documentElement.style.setProperty('--jijin-pre-color1',value.color1);
      }catch{}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="board-brand-stack">
      <a id="ownerTopLink" class="board-brand-kicker hidden" href="/">JIJIN BORD</a><span id="guestBrand" class="board-brand-kicker">JIJIN BORD</span>
      <strong id="boardName" class="board-brand-title">読み込み中…</strong>
    </div>
    <div id="presenceBar" class="presence-bar"></div>
    <nav class="app-tabs" aria-label="ページ切り替え">
      <button class="active" data-tool="log">LOGCOMMENTS</button><button data-tool="matrix">MAGIA MATRIX</button><button data-tool="spreadsheet">SPREADSHEET</button>
    </nav>
    <div class="top-actions"><button id="shareBoard" class="quiet">共有URL</button><button id="profileButton" class="quiet">発言者</button></div>
  </header>
  <div class="board-layout">
    <aside id="logSidebar" class="log-sidebar">
      <div class="log-list-head"><span>LOGS</span><button id="addLogButton" class="hidden" type="button">＋</button></div>
      <div id="logList" class="log-list"></div>
      <p id="emptyLogs" class="empty-note hidden">まだログはありません。</p>
    </aside>
    <main class="tool-stage">
      <section id="welcome" class="welcome board-home">
        <div class="board-home-shell">
          <img id="boardHomeImage" class="board-home-image hidden" alt="部屋のトップ画像">
          <div id="boardHomeEmpty" class="board-home-empty"><strong>JIJINBOARD</strong></div>
          <label id="boardHomeUpload" class="board-home-upload hidden"><span id="boardHomeUploadLabel">スクショを設定</span><input id="boardHomeInput" type="file" accept="image/*"></label>
        </div>
      </section>
      <iframe id="logFrame" class="tool-frame hidden" title="LOGCOMMENTS"></iframe>
      <iframe id="matrixFrame" class="tool-frame hidden" title="MAGIA MATRIX"></iframe>
      <iframe id="spreadsheetFrame" class="tool-frame hidden" title="SPREADSHEET" style="visibility:hidden"></iframe>
    </main>
  </div>
  <dialog id="spoilerDialog"><div class="spoiler-card"><p>UNOPENED LOG</p><span id="spoilerLabel" class="hidden">LOG</span><h2 id="spoilerTitle"></h2><small id="spoilerParticipants" class="hidden"></small><strong>この先にはシナリオのネタバレを含みます。</strong><div><button id="confirmOpen" class="primary">ログを開く</button></div></div></dialog>
  <dialog id="logEditDialog"><form id="logEditForm" class="log-edit-card"><div><span></span><button type="button" id="closeLogEdit" class="log-edit-close">×</button></div><label class="log-spoiler-edit"><input id="logSpoilerInput" type="checkbox"><span>このログをネタバレ有りにする</span></label><label>シナリオタイトル<input id="logScenarioTitle" maxlength="120"></label><label>参加キャラ<input id="logScenarioParticipants" maxlength="300"></label><div><button type="submit" class="primary">保存</button><button type="button" id="deleteLogButton" class="log-delete-text">ログを削除する</button></div></form></dialog>
  <dialog id="boardProfileDialog"><form id="boardProfileForm" class="board-profile-card"><p>PL SETUP</p><h2 id="boardProfileTitle">PLの設定</h2><label>あなたのPL名<input id="boardPlName" maxlength="80" required></label><label>PLアイコン（任意）<input id="boardPlIcon" type="file" accept="image/*"></label><label>PLのマーカー色<input id="boardPlColor" type="color" value="#ffe66b"></label><button class="primary" type="submit">この部屋に入る</button></form></dialog>
  <script>
    const __boardIdForOpenedState=new URL(location.href).searchParams.get("id");
    if(__boardIdForOpenedState)sessionStorage.removeItem(`jijinboardOpenedLogs:${__boardIdForOpenedState}`);
    window.__jijinboardBootstrapStarted=false;
    function __jijinboardScriptLoadError(){
      const name=document.getElementById("boardName"),empty=document.getElementById("emptyLogs");
      if(name)name.textContent="読み込みに失敗しました";
      if(empty)empty.textContent="ページを再読み込みしてください。";
    }
  </script>
  <script src="board2.js?v=20260902-2" onload="window.__jijinboardBootstrapStarted=true" onerror="__jijinboardScriptLoadError()"></script>
  <script src="board-home.js?v=20260902-4"></script>
  <script src="top-cover-fix.js?v=20260902-3"></script>
  <script src="board-profile-overlay.js?v=20260830-1"></script>
  <script src="matrix-icon-bridge.js?v=20260829-2"></script>
  <script src="board-spoiler-preview.js?v=20260829-2"></script>
  <script src="board-log-meta.js?v=20260830-6"></script>
  <script src="board-tab-settings.js?v=20260829-2"></script>
  <script src="board-profile.js?v=20260829-5"></script>
  <script src="theme-scoped.js?v=20260830-8"></script>
  <script src="shared-background-sync.js?v=20260830-1"></script>
  <script src="log-no-shadows.js?v=20260830-1"></script>
  <script src="group-row-colors.js?v=20260830-3"></script>
  <script>
    const __logFrame=document.getElementById('logFrame');
    function __hideEmbeddedLogThemeToggle(){
      try{
        const button=__logFrame?.contentDocument?.getElementById('themeBtn');
        if(!button)return;
        button.hidden=true;
        button.setAttribute('aria-hidden','true');
        button.tabIndex=-1;
        button.style.setProperty('display','none','important');
      }catch{}
    }
    __logFrame?.addEventListener('load',()=>{__hideEmbeddedLogThemeToggle();setTimeout(__hideEmbeddedLogThemeToggle,80)});

    const __spreadsheetFrame=document.getElementById('spreadsheetFrame');
    function __forceSpreadsheetCommentsVisible(){
      try{
        const doc=__spreadsheetFrame?.contentDocument;
        if(!doc?.head)return;
        let style=doc.getElementById('jijinBoardEmbeddedOnlyStyle');
        if(!style){
          style=doc.createElement('style');
          style.id='jijinBoardEmbeddedOnlyStyle';
          doc.head.appendChild(style);
        }
        style.textContent='.sheet-settings-panel[data-settings-panel="character"] .character-page-mode-setting{display:none!important}html.embedded #sheetComments[hidden]{display:flex!important}';
        const panel=doc.getElementById('sheetComments');
        if(panel){panel.hidden=false;panel.removeAttribute('hidden');panel.classList.remove('hidden')}
      }catch{}
    }
    __spreadsheetFrame?.addEventListener('load',()=>{__forceSpreadsheetCommentsVisible();setTimeout(__forceSpreadsheetCommentsVisible,80);setTimeout(__forceSpreadsheetCommentsVisible,400)});
  </script>
  <script>
    setTimeout(()=>{
      const name=document.getElementById("boardName");
      if(window.__jijinboardBootstrapStarted&&name?.textContent==="読み込み中…"){
        name.textContent="読み込みに失敗しました";
        const empty=document.getElementById("emptyLogs");
        if(empty)empty.textContent="再読み込みしても直らない場合は接続を確認してください。";
      }
    },8000);
  </script>
</body>
</html>
