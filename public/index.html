<!doctype html>
<html lang="ja">
<head>
<script src="/shared/dataset-guard.js?v=20261112-startup-recovery"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,noarchive">
  <title>JIJINBOARD 管理TOP</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>
  <header class="project-bar"><span class="project-brand">TRPG LOG MARKER</span><span class="owner-badge">ROOM OWNER</span></header>
  <main class="project-main">
    <section class="hero"><p class="eyebrow">PRIVATE OWNER DASHBOARD</p><h1>JIJINBOARD</h1><p>自陣ごとにログ、MAGIA MATRIX、Sheetsをまとめる管理TOPです。このブラウザで作成した部屋だけを表示します。</p></section>
    <section class="project-section" id="boards">
      <div class="section-head"><div><p class="eyebrow">MY ROOMS</p><h2>自陣の部屋</h2></div><button class="primary-button" id="addBoardButton" type="button">＋ 自陣の部屋</button></div>
      <div id="boardList" class="session-grid"></div><p id="boardEmpty" class="empty-copy">まだ自陣の部屋はありません。右上から作成してください。</p><p id="boardStatus" class="status-copy"></p>
    </section>
    <p class="section-note">PL・PCは各部屋の「設定」から登録・管理します。</p>
  </main>
  <dialog id="boardDialog"><form id="boardForm" method="dialog">
    <div class="dialog-head"><strong>自陣の部屋を作る</strong><button type="button" class="close-button" id="closeBoardDialog">×</button></div>
    <label>管理TOPで使う名前<input id="boardName" maxlength="120" placeholder="例：いつもの自陣" required></label>
    <p class="dialog-note">参加者には、このあと部屋内の「共有URL」を渡します。管理TOPの一覧は共有されません。</p>
    <div class="dialog-actions"><button class="primary-button" type="submit">作成</button></div>
  </form></dialog>

  <script src="project.js?v=20261102-room1"></script>
</body>
</html>
